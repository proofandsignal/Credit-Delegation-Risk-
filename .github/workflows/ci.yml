name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke test Synthetic 100
        run: credit-risk synthetic100 --out /tmp/credit-risk-synthetic100
