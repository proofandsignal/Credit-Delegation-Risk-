name: Forward 50 Live Snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_block:
        description: "Optional fixed Ethereum block number; leave blank to freeze latest at run start"
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AAVE_RPC_URL: ${{ secrets.AAVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require RPC secret
        run: |
          if [ -z "$AAVE_RPC_URL" ]; then
            echo "Missing repository secret: AAVE_RPC_URL"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Collect Forward 50
        shell: bash
        run: |
          if [ -n "${{ inputs.snapshot_block }}" ]; then
            credit-risk forward50-live --snapshot-block "${{ inputs.snapshot_block }}" --out data/forward50/t0.json
          else
            credit-risk forward50-live --out data/forward50/t0.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forward50-t0
          path: data/forward50/t0.json
          if-no-files-found: error
