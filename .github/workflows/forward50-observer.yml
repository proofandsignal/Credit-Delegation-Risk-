name: Forward 50 Daily Observer

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - build/v0.3-forward-outcome-observer
    paths:
      - ".github/workflows/forward50-observer.yml"
      - "src/credit_delegation_risk/observer.py"
      - "config/forward50_observer_contract.json"

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      AAVE_RPC_URL: ${{ secrets.AAVE_RPC_URL }}
      GH_TOKEN: ${{ github.token }}
      BASELINE_ARTIFACT_ID: "11694242426"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require RPC secret
        run: |
          if [ -z "$AAVE_RPC_URL" ]; then
            echo "Missing repository secret: AAVE_RPC_URL"
            exit 1
          fi

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Fetch frozen T0 artifact
        run: |
          rm -rf runtime
          mkdir -p runtime/baseline
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" > runtime/baseline.zip
          unzip -q runtime/baseline.zip -d runtime/baseline
          test -f runtime/baseline/t0.json
          test -f runtime/baseline/t0_decisions.json

      - name: Validate frozen baseline hashes
        run: |
          python - <<'PY'
          from credit_delegation_risk.observer import validate_frozen_baseline_files
          validate_frozen_baseline_files(
              "runtime/baseline/t0.json",
              "runtime/baseline/t0_decisions.json",
          )
          print("Frozen baseline hashes: PASS")
          PY

      - name: Observe frozen cohort
        run: |
          credit-risk forward50-observe             --t0 runtime/baseline/t0.json             --decisions runtime/baseline/t0_decisions.json             --out runtime/observation.json

      - name: Observation metadata
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("runtime/observation.json"))
          print(f"block={data['observed_block']}")
          print(f"observed_at={data['observed_at']}")
          PY

      - name: Validate observation
        run: |
          python - <<'PY'
          import json
          data = json.load(open("runtime/observation.json"))
          rows = data["records"]
          assert data["record_count"] == 50
          assert len(rows) == 50
          assert len({r["wallet_address"] for r in rows}) == 50
          assert all(r["observed_block"] == data["observed_block"] for r in rows)
          print(f"Observed block: {data['observed_block']}")
          print(f"Observed at: {data['observed_at']}")
          print(f"HF<1 samples: {sum(r['sampled_health_factor_below_1_0'] for r in rows)}")
          print(f"Liquidation seen: {sum(r['liquidation_event_since_t0'] for r in rows)}")
          PY

      - name: Write summary
        run: |
          echo "## FORWARD 50 — Daily Observer" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Observed block: ${{ steps.metadata.outputs.block }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Observed at: ${{ steps.metadata.outputs.observed_at }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frozen wallets: 50" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline hashes: PASS" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: forward50-observation-${{ steps.metadata.outputs.block }}
          path: |
            runtime/observation.json
            runtime/baseline/t0.json
            runtime/baseline/t0_decisions.json
          retention-days: 90
          if-no-files-found: error
